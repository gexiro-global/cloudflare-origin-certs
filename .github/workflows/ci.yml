name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - run: shellcheck cf-origin-issue.sh ols-ssl-wire.sh tests/run_tests.sh
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tests/run_tests.sh
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No credential-shaped strings in the tree
        run: |
          if grep -rInE '[0-9a-f]{32,}' --exclude-dir=.git .; then
            echo 'possible credential found - refusing'; exit 1
          fi
          echo 'clean'

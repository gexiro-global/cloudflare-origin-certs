name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - run: shellcheck cf-origin-issue.sh ols-ssl-wire.sh tests/run_tests.sh tests/fake-origin-ca.sh
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: ./tests/run_tests.sh
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # A grep for long hex strings was the original check. It flagged the pinned action SHAs the
      # moment those were added - a heuristic that cannot tell a commit id from a credential is
      # one people learn to bypass. Use a real scanner instead.
      - name: Install gitleaks
        run: |
          VERSION=8.28.0
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  /tmp/gitleaks.tar.gz" \
            | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan the working tree
        run: gitleaks dir . --config .gitleaks.toml --redact --verbose
      - name: Scan the full history
        run: gitleaks git . --config .gitleaks.toml --redact --verbose
